version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: livestation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livestation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livestation_password}
      POSTGRES_DB: ${POSTGRES_DB:-livestation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livestation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livestation-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: livestation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livestation-network

  # SRS Media Server
  srs:
    image: ossrs/srs:5
    container_name: livestation-srs
    ports:
      - "1935:1935"   # RTMP
      - "1985:1985"   # HTTP API
      - "8080:8080"   # HTTP Server
      - "8088:8088"   # HTTPS
    volumes:
      - ./media-server/srs/srs.conf:/usr/local/srs/conf/srs.conf
      - srs_recordings:/var/recordings
      - srs_hls:/var/hls
    environment:
      - CANDIDATE=${SRS_CANDIDATE:-0.0.0.0}
    networks:
      - livestation-network
    restart: unless-stopped

  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: livestation-backend
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-livestation}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-livestation_password}
      - POSTGRES_DB=${POSTGRES_DB:-livestation}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SRS_HTTP_API=http://srs:1985
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-livestation-recordings}
    volumes:
      - ./backend:/app
      - backend_recordings:/var/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      srs:
        condition: service_started
    networks:
      - livestation-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    container_name: livestation-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8081
      - REACT_APP_WS_URL=ws://localhost:8081/ws
      - REACT_APP_RTMP_URL=rtmp://localhost:1935/live
      - REACT_APP_HLS_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - livestation-network
    stdin_open: true
    tty: true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: livestation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - srs
    networks:
      - livestation-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  srs_recordings:
  srs_hls:
  backend_recordings:

networks:
  livestation-network:
    driver: bridge
