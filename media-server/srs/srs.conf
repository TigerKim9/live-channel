# SRS Configuration for Live Station Platform
# MIT License - https://github.com/ossrs/srs

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API Configuration
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP Server Configuration
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Statistics
stats {
    network         0;
    disk            sda vda xvda xvdb;
}

# Virtual Host for Live Streaming
vhost __defaultVhost__ {
    # HLS Configuration
    hls {
        enabled         on;
        hls_path        /var/hls;
        hls_fragment    10;
        hls_window      60;
        hls_cleanup     on;
        hls_dispose     0;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # HTTP Remux for streaming
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # DVR (Recording) Configuration
    dvr {
        enabled         on;
        dvr_path        /var/recordings/[app]/[stream]/[2006]/[01]/[02]/[timestamp].flv;
        dvr_plan        segment;
        dvr_duration    30;
        dvr_wait_keyframe   on;
        time_jitter     full;
    }

    # Time Machine (DVR for replay)
    # Allows viewers to seek back up to 6 hours
    hls {
        enabled         on;
        hls_path        /var/hls;
        hls_fragment    10;
        # 6 hours = 21600 seconds / 10 seconds per fragment = 2160 fragments
        hls_window      21600;
        hls_cleanup     on;
        hls_dispose     0;
    }

    # Transcoding Configuration
    transcode {
        enabled     on;
        ffmpeg      /usr/bin/ffmpeg;

        # 1080p (Original)
        engine 1080p {
            enabled         on;
            vcodec          libx264;
            vbitrate        4000;
            vfps            30;
            vwidth          1920;
            vheight         1080;
            vthreads        4;
            vprofile        main;
            vpreset         medium;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_1080p;
        }

        # 720p
        engine 720p {
            enabled         on;
            vcodec          libx264;
            vbitrate        2500;
            vfps            30;
            vwidth          1280;
            vheight         720;
            vthreads        4;
            vprofile        main;
            vpreset         medium;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_720p;
        }

        # 480p
        engine 480p {
            enabled         on;
            vcodec          libx264;
            vbitrate        1200;
            vfps            30;
            vwidth          854;
            vheight         480;
            vthreads        2;
            vprofile        main;
            vpreset         medium;
            acodec          aac;
            abitrate        96;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_480p;
        }

        # 360p
        engine 360p {
            enabled         on;
            vcodec          libx264;
            vbitrate        800;
            vfps            30;
            vwidth          640;
            vheight         360;
            vthreads        2;
            vprofile        baseline;
            vpreset         medium;
            acodec          aac;
            abitrate        96;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_360p;
        }
    }

    # HTTP Hooks for backend integration
    http_hooks {
        enabled         on;

        # Authentication hook
        on_publish      http://backend:8080/api/v1/hooks/on_publish;
        on_unpublish    http://backend:8080/api/v1/hooks/on_unpublish;

        # Playback hooks
        on_play         http://backend:8080/api/v1/hooks/on_play;
        on_stop         http://backend:8080/api/v1/hooks/on_stop;

        # DVR hooks
        on_dvr          http://backend:8080/api/v1/hooks/on_dvr;

        # HLS hooks
        on_hls          http://backend:8080/api/v1/hooks/on_hls;
    }

    # Security
    security {
        enabled         on;
        seo             on;
    }

    # GOP cache for low latency
    gop_cache       on;
    queue_length    10;

    # TCP nodelay for low latency
    tcp_nodelay     on;

    # Minimum latency mode
    min_latency     on;

    # Reduce buildup latency to 0.5s
    publish {
        mr          off;
    }
    play {
        gop_cache       on;
        queue_length    10;
        mw_latency      100;
    }
}

# Re-stream configuration (forward to multiple platforms)
vhost restream.livestation.com {
    dvr {
        enabled         off;
    }

    # Forward to multiple platforms
    forward {
        enabled on;
        destination 127.0.0.1:1936;  # YouTube
        destination 127.0.0.1:1937;  # Twitch
        destination 127.0.0.1:1938;  # Facebook
    }
}
